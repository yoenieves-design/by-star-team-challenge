name: Verify prototype
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - run: node --check dist/app.js
      - run: php -l wordpress/snippets/by-star-app.php
      - run: git diff --exit-code -- dist wordpress/snippets
